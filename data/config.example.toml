# ~/.config/walky/config.toml
[repo]
path = "~/Sync"
# repo_id из /WALKY/walky.json; пусто = доверять любому маркеру (не рекомендуется)
repo_id = ""

[sync]
mode = "two-way"          # two-way | push-only
conflict = "copy"         # copy | newest | local-wins
debounce_ms = 3000
full_scan_min = 10
workers = 0               # 0 = авто (NumCPU, но не больше 8 на HDD)
max_file_size = "8G"
sync_on_battery = true

[exclude]
patterns = [
  "**/node_modules",
  "**/target",
  "**/build",
  "**/.venv",
  "**/__pycache__",
  "**/.cache",
  "**/*.lock",
  "**/*.tmp",
]

[retention]
daily = 14
weekly = 8
monthly = 6
trash_days = 30

[device]
require_luks = true
auto_sync = true
eject_after_sync = false
