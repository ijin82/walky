# ~/.config/walky/config.toml
[repo]
path = "~/Sync"
# repo_id from /WALKY/walky.json; empty = trust any marker (not recommended)
repo_id = ""

[sync]
mode = "two-way"          # two-way | push-only
conflict = "copy"         # copy | newest | local-wins
debounce_ms = 3000
full_scan_min = 10
workers = 0               # 0 = auto (NumCPU, capped at 8 on HDD)
max_file_size = "8G"
sync_on_battery = true
# How often to look for local changes while the drive is attached; 0 disables.
poll_seconds = 180
notify_on_sync = false

[exclude]
patterns = [
  "**/node_modules",
  # PHP Composer and similar dependency trees; also matches Go vendor/.
  "**/vendor",
  "**/target",
  "**/build",
  "**/.venv",
  "**/__pycache__",
  "**/.cache",
  "**/*.lock",
  "**/*.tmp",
]

[retention]
daily = 14
weekly = 8
monthly = 6
trash_days = 30
machine_days = 180

[maintenance]
auto_gc = true
gc_interval_hours = 24

[device]
# Only used when the desktop does not mount the drive itself.
label = "WALKY"
auto_sync = true
auto_mount = true
eject_after_sync = false
